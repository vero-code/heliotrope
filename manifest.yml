modules:
  jira:issuePanel:
    - key: heliotrope-hello-world-issue-panel
      resource: main
      resolver:
        function: resolver
      render: native
      title: Heliotrope: Patient Safety Assessment
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: resolver
      handler: index.handler
resources:
  - key: main
    path: src/frontend/index.jsx
permissions:
  scopes:
    - storage:app
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/8926276c-2a13-466e-814f-55b729f428d6
